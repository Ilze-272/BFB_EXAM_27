<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="url(#heroGradient)"/>
  
  <!-- Community Circle - represents connection -->
  <circle cx="900" cy="200" r="150" fill="#ffffff" opacity="0.1"/>
  <circle cx="900" cy="200" r="120" fill="#ffffff" opacity="0.15"/>
  
  <!-- Food Icons -->
  <!-- Bread/Bakery -->
  <ellipse cx="800" cy="150" rx="35" ry="25" fill="#FFD700" opacity="0.8"/>
  <ellipse cx="800" cy="145" rx="35" ry="20" fill="#FFA500" opacity="0.8"/>
  
  <!-- Apple/Fruit -->
  <circle cx="950" cy="180" r="30" fill="#FF6347" opacity="0.8"/>
  <rect x="945" y="155" width="10" height="15" fill="#228B22" opacity="0.8"/>
  
  <!-- Vegetable/Carrot -->
  <path d="M 1000 220 L 1010 280 L 1000 285 L 990 280 Z" fill="#FF8C00" opacity="0.8"/>
  <path d="M 1000 215 L 1005 220 L 1000 225 L 995 220 Z" fill="#228B22" opacity="0.8"/>
  
  <!-- Plate with food -->
  <ellipse cx="850" cy="250" rx="45" ry="15" fill="#E0E0E0" opacity="0.8"/>
  <circle cx="850" cy="235" r="25" fill="#CD853F" opacity="0.8"/>
  <circle cx="845" cy="230" r="8" fill="#FFD700" opacity="0.6"/>
  <circle cx="855" cy="238" r="6" fill="#FF6347" opacity="0.6"/>
  
  <!-- Hearts - representing care and community -->
  <path d="M 920 100 C 920 95, 925 90, 930 90 C 935 90, 940 95, 940 100 C 940 110, 930 120, 920 130 C 910 120, 900 110, 900 100 C 900 95, 905 90, 910 90 C 915 90, 920 95, 920 100 Z" fill="#ffffff" opacity="0.6"/>
  
  <path d="M 1050 240 C 1050 237, 1053 235, 1056 235 C 1059 235, 1062 237, 1062 240 C 1062 245, 1056 250, 1050 255 C 1044 250, 1038 245, 1038 240 C 1038 237, 1041 235, 1044 235 C 1047 235, 1050 237, 1050 240 Z" fill="#ffffff" opacity="0.6"/>
  
  <!-- Connecting lines - representing network -->
  <line x1="800" y1="150" x2="850" y2="235" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="950" y1="180" x2="900" y2="200" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="1000" y1="250" x2="950" y2="200" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- People silhouettes - community -->
  <circle cx="750" cy="280" r="20" fill="#ffffff" opacity="0.7"/>
  <path d="M 750 300 C 745 300, 730 310, 730 320 L 770 320 C 770 310, 755 300, 750 300 Z" fill="#ffffff" opacity="0.7"/>
  
  <circle cx="1100" cy="150" r="18" fill="#ffffff" opacity="0.7"/>
  <path d="M 1100 168 C 1095 168, 1082 176, 1082 185 L 1118 185 C 1118 176, 1105 168, 1100 168 Z" fill="#ffffff" opacity="0.7"/>
  
  <!-- Recycling/sustainability symbol -->
  <path d="M 980 310 L 990 330 L 970 330 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M 1000 315 L 1010 335 L 990 335 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M 990 300 L 1000 320 L 980 320 Z" fill="#ffffff" opacity="0.5"/>
  
  <!-- Text area indicator (decorative shape) -->
  <rect x="50" y="100" width="600" height="200" fill="#ffffff" opacity="0.05" rx="10"/>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="150" cy="100" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="75" r="6" fill="#ffffff" opacity="0.3"/>
  <circle cx="650" cy="350" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="700" cy="330" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="750" cy="360" r="6" fill="#ffffff" opacity="0.3"/>
</svg>
